[package]
name = "astro-stacker-desktop"
description = "Desktop shell for astro-stacker (Tauri 2)"
version = "0.26.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Pavel Belov <psbelov@gmail.com>"]

# Its own workspace on purpose: Tauri pulls in a large dependency tree, and
# leaving it out of the root workspace keeps `cargo test` at the top of the
# project fast and free of it.
[workspace]

[lib]
name = "astro_stacker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "1.1.6"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
astro-core = { path = "../../../crates/astro-core" }
astro-format-raw = { path = "../../../crates/astro-format-raw" }
tauri-plugin-log = "2.9.1"
tauri-plugin-opener = "2.5.5"
log = "0.4.34"

# The core catches a panicking plugin rather than letting it take the process
# down, which needs unwinding.
[profile.release]
panic = "unwind"
lto = "thin"

# Decoding a raw frame in a debug build is unusably slow otherwise.
[profile.dev.package."*"]
opt-level = 3
