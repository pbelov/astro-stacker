[package]
name = "astro-plugin-abi"
description = "Stable C ABI shared by the astro-stacker host and its format plugins"
version.workspace = true
edition.workspace = true
# Deliberately not the workspace's. This is the crate a plugin author compiles
# against, so its floor is a promise to someone outside this repository, and it
# must not rise because the host wanted a newer dependency. Kept at the value
# this crate has been built with rather than lowered to the edition's own
# minimum, which nothing here has tested.
rust-version = "1.88"
license.workspace = true
authors.workspace = true

# Deliberately dependency-free: a plugin author should be able to depend on this
# crate without pulling in anything else, and a non-Rust plugin only needs the
# layouts described in `abi`.
[dependencies]
