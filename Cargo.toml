[workspace]
resolver = "3"
members = [
    "crates/astro-core",
    "crates/astro-format-raw",
    "crates/astro-cli",
]

[workspace.package]
version = "0.25.4"
edition = "2024"
# Everything but the decoder, which declares its own: rawler's floor is lower
# than ours and there is no reason to hold the rest of the project back to it.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Pavel Belov <psbelov@gmail.com>"]

[workspace.dependencies]
astro-core = { path = "crates/astro-core" }
astro-format-raw = { path = "crates/astro-format-raw" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
# Pinned exactly, not floated. rawler does not follow SemVer - a patch
# release can change what a decode returns - and a decoder that changes
# under a `cargo update` would change every measurement in this project
# without a commit saying so. Raising it is a deliberate act with frames
# re-read on both sides.
rawler = "=0.7.2"
rayon = "1"
# Only the `system` half: this is asked two questions, how much memory is free
# and how many cores are physical, and neither wants processes or disks.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
