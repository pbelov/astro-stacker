[workspace]
resolver = "3"
members = [
    "crates/astro-plugin-abi",
    "crates/astro-core",
    "crates/astro-cli",
    "plugins/astro-format-canon",
]

[workspace.package]
version = "0.19.3"
edition = "2024"
# The host's floor, and only the host's. It is free to follow what `astro-core`
# depends on, because the crate a plugin author builds against declares its own
# and does not inherit this one — see `crates/astro-plugin-abi`.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Pavel Belov <psbelov@gmail.com>"]

[workspace.dependencies]
astro-plugin-abi = { path = "crates/astro-plugin-abi" }
astro-core = { path = "crates/astro-core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
libloading = "0.9"
log = "0.4"
rawler = "0.7"
rayon = "1"
# Only the `system` half: this is asked two questions, how much memory is free
# and how many cores are physical, and neither wants processes or disks.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
